[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-delivery-predictor"
version = "0.1.0"
description = "Predict late deliveries at checkout on the Olist Brazilian e-commerce dataset."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
kaggle = ["kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
